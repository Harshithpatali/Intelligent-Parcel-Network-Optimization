services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
  dashboard:
    build: .
    command: ["streamlit","run","app/streamlit_app.py","--server.address=0.0.0.0","--server.port=8501","--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

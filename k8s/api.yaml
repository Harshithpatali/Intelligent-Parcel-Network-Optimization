apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: parcel-api}
  template:
    metadata:
      labels: {app: parcel-api}
    spec:
      containers:
        - name: api
          image: your-registry/parcel-network-optimization:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef: {name: parcel-api-secrets}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: parcel-api
spec:
  selector: {app: parcel-api}
  ports: [{port: 8000, targetPort: 8000}]
